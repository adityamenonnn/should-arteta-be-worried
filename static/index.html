<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Should Arteta Be Worried?</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

    <h1>Should Arteta Be Worried?</h1>
    <p class="subtitle">tracking what r/Gunners thinks, updated every 6 hours</p>
    <nav><a href="/squad">squad lab</a></nav>

    <div class="worry-num" id="worry-number">--</div>
    <p class="worry-verdict" id="worry-verdict"></p>

    <h2>last 60 days</h2>
    <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>

    <h2>forecast (next 7 days)</h2>
    <p class="forecast-info" id="forecast-info"></p>
    <div class="chart-wrap"><canvas id="forecast-chart"></canvas></div>
    <p class="features" id="forecast-features"></p>

    <div class="two-col">
        <div>
            <h2>recent results</h2>
            <div class="matches" id="match-list"></div>
        </div>
        <div>
            <h2>by topic</h2>
            <div class="topic-list" id="topic-list"></div>
        </div>
    </div>

    <h2>posts <span id="post-count" style="color:#ccc"></span></h2>
    <div class="posts" id="post-list"></div>

    <footer id="footer"></footer>

    <script src="/static/app.js"></script>
</body>
</html>
